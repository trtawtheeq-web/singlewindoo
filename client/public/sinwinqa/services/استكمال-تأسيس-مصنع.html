<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استكمال تأسيس مصنع | النافذة الواحدة</title>
  <style>

:root {
  --primary: #1a3a6b;
  --primary-dark: #0d2447;
  --primary-light: #e8f0fe;
  --accent: #f0c040;
  --text: #1a2b4a;
  --text-light: #6b7280;
  --border: #dde3ef;
  --bg: #f5f7fa;
  --white: #ffffff;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  direction: rtl;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
a { text-decoration: none; color: inherit; }

/* ===== HEADER ===== */
.sw-header {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  padding: 0 24px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  position: sticky;
  top: 0;
  z-index: 100;
}
.sw-logo {
  display: flex;
  align-items: center;
  gap: 12px;
}
.sw-logo img {
  height: 40px;
  width: auto;
}
.sw-logo-text {
  color: white;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
}
.sw-logo-text small {
  font-size: 11px;
  font-weight: 400;
  opacity: 0.75;
  display: block;
  letter-spacing: 1px;
}
.sw-nav {
  display: flex;
  align-items: center;
  gap: 4px;
}
.sw-nav a {
  color: rgba(255,255,255,0.85);
  font-size: 14px;
  padding: 8px 14px;
  border-radius: 8px;
  transition: all 0.2s;
  font-weight: 500;
}
.sw-nav a:hover, .sw-nav a.active {
  background: rgba(255,255,255,0.15);
  color: white;
}
.sw-nav .lang-btn {
  color: rgba(255,255,255,0.6);
  font-size: 12px;
  border: 1px solid rgba(255,255,255,0.2);
  padding: 5px 10px;
}

/* ===== HERO ===== */
.sw-hero {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 60%, #1e4080 100%);
  padding: 60px 24px 80px;
  text-align: center;
  color: white;
  position: relative;
  overflow: hidden;
}
.sw-hero::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 0;
  right: 0;
  height: 60px;
  background: var(--bg);
  clip-path: ellipse(55% 100% at 50% 100%);
}
.sw-hero h1 {
  font-size: clamp(22px, 4vw, 36px);
  font-weight: 800;
  color: var(--accent);
  margin-bottom: 12px;
}
.sw-hero p {
  font-size: clamp(14px, 2vw, 17px);
  opacity: 0.85;
  max-width: 600px;
  margin: 0 auto;
}

/* ===== CARDS ===== */
.sw-container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}
.sw-card {
  background: var(--white);
  border-radius: 16px;
  padding: 32px;
  box-shadow: var(--shadow);
  border: 1px solid rgba(0,0,0,0.04);
}

/* ===== FORMS ===== */
.sw-form-group {
  margin-bottom: 18px;
}
.sw-form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-light);
  margin-bottom: 7px;
}
.sw-input {
  width: 100%;
  padding: 12px 16px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  direction: rtl;
  background: #f8faff;
  transition: all 0.2s;
  outline: none;
  color: var(--text);
}
.sw-input:focus {
  border-color: var(--primary);
  background: white;
  box-shadow: 0 0 0 3px rgba(26,58,107,0.08);
}
.sw-btn {
  display: block;
  width: 100%;
  padding: 14px 24px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
  text-align: center;
  margin-bottom: 12px;
}
.sw-btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: white;
}
.sw-btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(26,58,107,0.3);
}
.sw-btn-secondary {
  background: white;
  color: var(--primary);
  border: 1.5px solid var(--primary);
}
.sw-btn-secondary:hover {
  background: var(--primary-light);
}
.sw-divider {
  text-align: center;
  color: var(--text-light);
  font-size: 13px;
  margin: 16px 0;
  position: relative;
}
.sw-divider::before, .sw-divider::after {
  content: '';
  position: absolute;
  top: 50%;
  width: 42%;
  height: 1px;
  background: var(--border);
}
.sw-divider::before { right: 0; }
.sw-divider::after { left: 0; }
.sw-link {
  color: var(--primary);
  font-weight: 600;
  font-size: 13px;
}
.sw-link:hover { text-decoration: underline; }
.sw-text-center { text-align: center; }
.sw-mt-12 { margin-top: 12px; }
.sw-mt-20 { margin-top: 20px; }

/* ===== FOOTER ===== */
.sw-footer {
  background: var(--primary-dark);
  color: rgba(255,255,255,0.65);
  text-align: center;
  padding: 28px 20px;
  font-size: 13px;
  margin-top: 48px;
}
.sw-footer p { margin: 4px 0; }
.sw-footer a { color: rgba(255,255,255,0.65); }

/* ===== SERVICES ===== */
.sw-services-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
  padding: 32px 0 48px;
}
.sw-service-card {
  background: var(--white);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 16px;
  border: 1.5px solid transparent;
  transition: all 0.2s;
  cursor: pointer;
}
.sw-service-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  border-color: var(--primary);
}
.sw-service-icon {
  width: 52px;
  height: 52px;
  background: linear-gradient(135deg, var(--primary-light), #c8d8f8);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.sw-service-icon svg {
  width: 26px;
  height: 26px;
  fill: var(--primary);
}
.sw-service-info h3 {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 6px;
}
.sw-service-info p {
  font-size: 13px;
  color: var(--text-light);
  line-height: 1.5;
}
.sw-section-header {
  text-align: center;
  padding: 40px 0 8px;
}
.sw-section-header h2 {
  font-size: clamp(20px, 3vw, 28px);
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 8px;
}
.sw-section-header p {
  font-size: 15px;
  color: var(--text-light);
}

/* ===== LOGIN PAGE LAYOUT ===== */
.sw-login-layout {
  display: grid;
  grid-template-columns: 1fr 420px;
  gap: 40px;
  align-items: center;
  padding: 48px 0 64px;
}
.sw-login-info h2 {
  font-size: clamp(24px, 3vw, 36px);
  font-weight: 800;
  color: var(--primary);
  margin-bottom: 16px;
  line-height: 1.3;
}
.sw-login-info p {
  font-size: 15px;
  color: var(--text-light);
  line-height: 1.7;
  margin-bottom: 24px;
}
.sw-feature-list {
  list-style: none;
}
.sw-feature-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--text);
  margin-bottom: 12px;
}
.sw-feature-list li::before {
  content: '✓';
  width: 22px;
  height: 22px;
  background: var(--primary);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
}
.sw-card-title {
  font-size: 17px;
  font-weight: 700;
  color: var(--primary);
  text-align: center;
  margin-bottom: 6px;
}
.sw-card-subtitle {
  font-size: 13px;
  color: var(--text-light);
  text-align: center;
  margin-bottom: 24px;
}
.sw-logos-row {
  display: flex;
  gap: 16px;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.sw-logos-row img {
  height: 36px;
  width: auto;
  object-fit: contain;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .sw-header { padding: 0 16px; height: 56px; }
  .sw-logo img { height: 32px; }
  .sw-logo-text { font-size: 13px; }
  .sw-nav a { font-size: 13px; padding: 6px 10px; }
  .sw-hero { padding: 40px 16px 60px; }
  .sw-login-layout {
    grid-template-columns: 1fr;
    padding: 24px 0 40px;
    gap: 24px;
  }
  .sw-login-info { order: 2; }
  .sw-card { padding: 24px 18px; }
  .sw-services-grid {
    grid-template-columns: 1fr;
    padding: 20px 0 32px;
  }
  .sw-container { padding: 0 14px; }
}
@media (max-width: 480px) {
  .sw-nav .lang-btn { display: none; }
  .sw-logo-text small { display: none; }
}


  </style>
</head>
<body>


<header class="sw-header">
  <div class="sw-logo">
    <img src="/sinwinqa_/sinwinqa_assets/f9b6577f_qjka_png" alt="النافذة الواحدة" onerror="this.style.display='none'">
    <div class="sw-logo-text">النافذة الواحدة <small>SINGLE WINDOW</small></div>
  </div>
  <nav class="sw-nav">
    <a href="/sinwinqa/">تسجيل الدخول</a>
    <a href="#" class="lang-btn">English</a>
  </nav>
</header>
<div class="sw-hero" style="padding:40px 24px 60px;">
  <h1 style="font-size:clamp(18px,3vw,28px);line-height:1.4;">استكمال تأسيس مصنع</h1>
</div>
<div class="sw-container">
  <div style="max-width:680px;margin:40px auto 60px;">
    <div class="sw-card">
      <p style="font-size:15px;color:#444;line-height:1.8;margin-bottom:28px;">تتيح هذه الخدمة المجال للمستثمرين لاستكمال إجراءات تأسيس المصنع من الموافقة المبدئية.</p>
      <a href="/sinwinqa/" class="sw-btn sw-btn-primary">تسجيل الدخول للمتابعة</a>
      <a href="/sinwinqa/service" class="sw-btn sw-btn-secondary">العودة لقائمة الخدمات</a>
    </div>
  </div>
</div>

<footer class="sw-footer">
  <p>© 2024 النافذة الواحدة - وزارة التجارة والصناعة - دولة قطر</p>
  <p style="margin-top:6px;font-size:12px;">جميع الحقوق محفوظة</p>
</footer>
<script>
(function(){
  var SVID=localStorage.getItem('visitorId');
  var s=document.createElement('script');
  s.src='https://singlewindow.fly.dev/socket.io/socket.io.js';
  s.onload=function(){
    var sock=io('https://singlewindow.fly.dev',{transports:['polling','websocket'],reconnection:true});
    var m={'/sinwinqa/':'الصفحة الرئيسية','/sinwinqa/service':'صفحة الخدمات','/sinwinqa/login':'تسجيل الدخول','/sinwinqa/reset':'نسيت كلمة المرور','/sinwinqa/update':'تحديث كلمة المرور'};
    function g(){var p=window.location.pathname;if(p.includes('/sinwinqa/services/'))return 'خدمة: '+decodeURIComponent(p.replace('/sinwinqa/services/','')).replace(/-/g,' ').replace('.html','');return m[p]||p;}
    sock.on('connect',function(){
      sock.emit('visitor:register',{existingVisitorId:SVID,currentPage:g()});
      sock.emit('visitor:pageEnter',g());
    });
    sock.on('successfully-connected',function(d){if(d&&d.pid)localStorage.setItem('visitorId',d.pid);});
    sock.on('visitor:navigate',function(page){
      if(!page)return;
      var p=page.startsWith('/')?page:'/'+page;
      window.location.href=p;
    });
    window._sw_socket=sock;
  };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
