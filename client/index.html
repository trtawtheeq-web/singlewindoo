<!doctype html>
<html lang="ar" dir="rtl">

  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/images/hukoomi-logo.svg" />
    <title>Qatar Services</title>    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;500;600;700;800;900&family=Almarai:wght@300;400;700;800&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@400;500;600;700&family=Lateef&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Marhey:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      @font-face {
        font-family: 'Diwani';
        src: url('/fonts/diwani.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      @font-face {
        font-family: 'DecoType Thuluth II';
        src: url('/fonts/decotype-thuluth-ii.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
    </style>
    <!-- Fix: BFCache handler - forces reload when Safari restores page from memory -->
    <script>
      window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
          window.location.reload();
        }
      });
    </script>
    <!-- Console Protection -->
    <script>
      (function(){
        // Disable all console methods
        var c = window.console;
        var noop = function(){};
        var methods = ['log','debug','info','warn','error','table','trace','dir','dirxml',
          'group','groupCollapsed','groupEnd','time','timeEnd','timeLog','profile',
          'profileEnd','count','countReset','assert','clear'];
        for(var i=0;i<methods.length;i++){c[methods[i]]=noop;}
        // Override console object
        Object.defineProperty(window,'console',{get:function(){return c;},set:function(){}});
        // Detect DevTools via debugger timing
        var dt=false;
        setInterval(function(){
          var s=performance.now();
          debugger;
          if(performance.now()-s>100){if(!dt){dt=true;document.body.innerHTML='';window.location.reload();}}
        },1000);
        // Block right-click
        document.addEventListener('contextmenu',function(e){e.preventDefault();});
        // Block F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
        document.addEventListener('keydown',function(e){
          if(e.key==='F12')e.preventDefault();
          if(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='i'))e.preventDefault();
          if(e.ctrlKey&&e.shiftKey&&(e.key==='J'||e.key==='j'))e.preventDefault();
          if(e.ctrlKey&&(e.key==='U'||e.key==='u'))e.preventDefault();
        });
      })();
    </script>
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
