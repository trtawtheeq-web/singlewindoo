[build]
  command = "cd client && pnpm install && pnpm run build"
  publish = "dist"

[[redirects]]
  from = "/sinwinqa/*"
  to = "/sinwinqa/:splat"
  status = 200

[[redirects]]
  from = "/sinwinqa_assets/*"
  to = "/sinwinqa_assets/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
